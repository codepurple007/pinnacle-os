services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pinnacle
      POSTGRES_PASSWORD: pinnacle
      POSTGRES_DB: pinnacleos
    ports:
      - "5432:5432"
    volumes:
      - pinnacle_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pinnacle -d pinnacleos"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://pinnacle:pinnacle@postgres:5432/pinnacleos
      WEB_ORIGIN: http://localhost:3001
      API_PUBLIC_URL: http://localhost:8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3001:3000"
    depends_on:
      - api

volumes:
  pinnacle_pg:
